name: Verify Documentation Drift

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'src/types/**'
      - 'src/App.tsx'
      - 'scripts/verify-doc-drift.mjs'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'src/types/**'
      - 'src/App.tsx'
      - 'scripts/verify-doc-drift.mjs'

jobs:
  verify-docs:
    name: Documentation Drift Verification Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Documentation Drift Verification Gate
        run: node scripts/verify-doc-drift.mjs
